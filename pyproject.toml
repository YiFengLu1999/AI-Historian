[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-historian"
dynamic = ["version"]
description = "Traceable person-centred temporal reconstruction for historical narratives"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE.md", "data-licenses.md"]
authors = [
  { name = "Yifeng Lu" },
  { name = "Zijie Yang" },
  { name = "Jie Li" },
  { name = "Qingkai Min" },
  { name = "Yue Zhang" },
]
keywords = ["digital-history", "temporal-reasoning", "historical-research", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "tqdm>=4.66,<5",
]

[project.scripts]
aih = "ai_historian.cli.evaluation:main"
aih-eval = "ai_historian.cli.evaluation:main"
aih-fulltext = "ai_historian.cli.fulltext:main"

[project.urls]
Homepage = "https://westlakehistorian.com"
Repository = "https://github.com/YiFengLu1999/AI-Historian"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_historian"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/LICENSE.md",
  "/NOTICE.md",
  "/data-licenses.md",
  "/CITATION.cff",
  "/README.md",
  "/VERSION",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "experiments",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
